name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Dependencies
        run: npm ci
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Decode Keystore
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d | gunzip > android/app/kipole.keystore || true

      - name: Verify Keystore
        working-directory: ./android
        run: |
          ls -la app/kipole.keystore
          sha256sum app/kipole.keystore
          echo "--- alias check ---"
          keytool -list -keystore app/kipole.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}"
      - name: Build AAB (Release)
        working-directory: ./android
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PATH: kipole.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Build APK (Release)
        working-directory: ./android
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: kipole.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
